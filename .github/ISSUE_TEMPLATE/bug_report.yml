name: Bug report
description: A query isn't being scoped the way you expect, or something throws unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **If this is a tenant-isolation bypass** (a query
        reaching the DB without its `tenantId` filter, or touching another
        tenant's rows), please **do not** file it here — report it privately per
        [SECURITY.md](https://github.com/hendriabdg-coder/nestjs-multi-tenant/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
      placeholder: "`order.findMany()` returned rows for another tenant when ..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a failing test. A repro against `example/` is ideal.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version + Node, Prisma, and NestJS versions.
      placeholder: "nestjs-multi-tenant 0.1.0, Node 20.11, Prisma 6.19, NestJS 11.1"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Config for `tenantScoped()` (exemptModels, etc.), logs, stack traces.
    validations:
      required: false
